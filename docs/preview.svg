<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 1200 640" role="img" aria-label="dsh-supervision: a running dsh web session in the browser, bridged to a terminal supervisor that reads OSC 7501 — state out, input back" font-family="-apple-system, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif">
  <title>dsh-supervision</title>
  <desc>A running DSH session bridges into any supervisor that reads OSC 7501 — state goes out, your input comes back, no second session.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6FEB"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F9E6D"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="64" y="54" fill="#2F6FEB" font-size="13" font-weight="600" letter-spacing="0.08em">dsh-supervision</text>
  <text x="1136" y="54" fill="#7A8794" font-size="12" text-anchor="end">infrastructure for super agents</text>
  <text x="64" y="112" fill="#141821" font-size="30" font-weight="700">Your agent works in the browser.</text>
  <text x="64" y="154" fill="#141821" font-size="30" font-weight="700">You steer it from the terminal.</text>
  <text x="64" y="194" fill="#5B6673" font-size="15">A running DSH session bridges into any supervisor that reads OSC 7501 — state goes out, your input comes back, no second session.</text>
  <rect x="64" y="232" width="470" height="220" rx="14" fill="#F7F9FC" stroke="#D9E0EA"/>
  <text x="88" y="272" fill="#141821" font-size="19" font-weight="700">dsh web</text>
  <text x="88" y="296" fill="#7A8794" font-size="13">the session you already run</text>
  <rect x="88" y="312" width="422" height="30" rx="8" fill="#FFFFFF" stroke="#E4E9F2"/>
  <text x="102" y="332" fill="#5B6673" font-size="12">Fix the flaky upload test</text>
  <rect x="88" y="348" width="422" height="30" rx="8" fill="#F2F4F8" stroke="#E4E9F2"/>
  <text x="102" y="368" fill="#5B6673" font-size="12">› running bash…</text>
  <rect x="88" y="384" width="422" height="30" rx="8" fill="#FFF6E6" stroke="#E4E9F2"/>
  <text x="102" y="404" fill="#5B6673" font-size="12">waiting for approval</text>
  <rect x="88" y="424" width="422" height="24" rx="6" fill="#EEF3FF"/>
  <text x="102" y="441" fill="#2F6FEB" font-size="11.5">Supervised from terminal · Take back control</text>
  <line x1="540" y1="318" x2="700" y2="318" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="620" y="310" fill="#2F6FEB" font-size="10.5" text-anchor="middle">state</text>
  <text x="620" y="344" fill="#7A8794" font-size="11" text-anchor="middle">bridge</text>
  <line x1="700" y1="362" x2="540" y2="362" stroke="#2F9E6D" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="620" y="382" fill="#2F9E6D" font-size="10.5" text-anchor="middle">input</text>
  <rect x="706" y="232" width="430" height="220" rx="14" fill="#F7F9FC" stroke="#D9E0EA"/>
  <text x="730" y="272" fill="#141821" font-size="19" font-weight="700">terminal supervisor</text>
  <text x="730" y="296" fill="#7A8794" font-size="13">herdr-core, or anything that reads OSC 7501</text>
  <text x="730" y="324" fill="#2F9E6D" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">● working      turn 3</text>
  <text x="730" y="350" fill="#C77D00" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">● blocked      bash approval</text>
  <text x="730" y="376" fill="#7A8794" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">› use postgres for the queue</text>
  <rect x="730" y="396" width="150" height="24" rx="12" fill="#EEFAF3" stroke="#7FCFA6"/>
  <text x="746" y="413" fill="#2F9E6D" font-size="11">✓ approved once</text>
  <circle cx="68" cy="500" r="5" fill="#2F6FEB"/>
  <text x="84" y="505" fill="#141821" font-size="15" font-weight="700">See</text>
  <text x="64" y="534" fill="#5B6673" font-size="12.5">One status record per session,</text>
  <text x="64" y="556" fill="#5B6673" font-size="12.5">always the current state.</text>
  <circle cx="452" cy="500" r="5" fill="#7B3FE4"/>
  <text x="468" y="505" fill="#141821" font-size="15" font-weight="700">Steer</text>
  <text x="448" y="534" fill="#5B6673" font-size="12.5">Type into the running turn —</text>
  <text x="448" y="556" fill="#5B6673" font-size="12.5">cancel, switch, attach.</text>
  <circle cx="836" cy="500" r="5" fill="#2F9E6D"/>
  <text x="852" y="505" fill="#141821" font-size="15" font-weight="700">Approve</text>
  <text x="832" y="534" fill="#5B6673" font-size="12.5">Answer parked tool approvals</text>
  <text x="832" y="556" fill="#5B6673" font-size="12.5">without leaving the terminal.</text>
  <text x="64" y="612" fill="#7A8794" font-size="12">OSC 7501 · any supervisor · no restart, no second session</text>
</svg>
