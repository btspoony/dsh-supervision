<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-supervision：浏览器里正在运行的 dsh web 会话桥接到读 OSC 7501 的终端 supervisor——状态出去，输入回来" font-family="-apple-system, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif">
  <title>dsh-supervision</title>
  <desc>一个正在运行的 DSH 会话，桥接进任何读 OSC 7501 的 supervisor——状态出去，输入回来，不用第二个会话。</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6FEB"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F9E6D"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="64" y="54" fill="#2F6FEB" font-size="13" font-weight="600" letter-spacing="0.08em">dsh-supervision</text>
  <text x="1136" y="54" fill="#7A8794" font-size="12" text-anchor="end">super agent 的基础设施</text>
  <text x="64" y="112" fill="#141821" font-size="30" font-weight="700">Agent 在浏览器里干活，</text>
  <text x="64" y="154" fill="#141821" font-size="30" font-weight="700">你在终端里指挥。</text>
  <text x="64" y="194" fill="#5B6673" font-size="15">一个正在运行的 DSH 会话，桥接进任何读 OSC 7501 的 supervisor——状态出去，输入回来，不用第二个会话。</text>
  <rect x="64" y="232" width="470" height="220" rx="14" fill="#F7F9FC" stroke="#D9E0EA"/>
  <text x="88" y="272" fill="#141821" font-size="19" font-weight="700">dsh web</text>
  <text x="88" y="296" fill="#7A8794" font-size="13">你已经在跑的那个会话</text>
  <rect x="88" y="312" width="422" height="30" rx="8" fill="#FFFFFF" stroke="#E4E9F2"/>
  <text x="102" y="332" fill="#5B6673" font-size="12">修一下那个不稳定的上传测试</text>
  <rect x="88" y="348" width="422" height="30" rx="8" fill="#F2F4F8" stroke="#E4E9F2"/>
  <text x="102" y="368" fill="#5B6673" font-size="12">› 正在跑 bash…</text>
  <rect x="88" y="384" width="422" height="30" rx="8" fill="#FFF6E6" stroke="#E4E9F2"/>
  <text x="102" y="404" fill="#5B6673" font-size="12">等待审批</text>
  <rect x="88" y="424" width="422" height="24" rx="6" fill="#EEF3FF"/>
  <text x="102" y="441" fill="#2F6FEB" font-size="11.5">来自终端的监督 · 收回控制权</text>
  <line x1="540" y1="318" x2="700" y2="318" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="620" y="310" fill="#2F6FEB" font-size="10.5" text-anchor="middle">状态</text>
  <text x="620" y="344" fill="#7A8794" font-size="11" text-anchor="middle">桥接</text>
  <line x1="700" y1="362" x2="540" y2="362" stroke="#2F9E6D" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="620" y="382" fill="#2F9E6D" font-size="10.5" text-anchor="middle">输入</text>
  <rect x="706" y="232" width="430" height="220" rx="14" fill="#F7F9FC" stroke="#D9E0EA"/>
  <text x="730" y="272" fill="#141821" font-size="19" font-weight="700">终端 supervisor</text>
  <text x="730" y="296" fill="#7A8794" font-size="13">herdr-core，或任何读 OSC 7501 的程序</text>
  <text x="730" y="324" fill="#2F9E6D" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">● 进行中      第 3 轮</text>
  <text x="730" y="350" fill="#C77D00" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">● 待审批      bash</text>
  <text x="730" y="376" fill="#7A8794" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">› 队列改用 postgres</text>
  <rect x="730" y="396" width="150" height="24" rx="12" fill="#EEFAF3" stroke="#7FCFA6"/>
  <text x="746" y="413" fill="#2F9E6D" font-size="11">✓ 已批准一次</text>
  <circle cx="68" cy="500" r="5" fill="#2F6FEB"/>
  <text x="84" y="505" fill="#141821" font-size="15" font-weight="700">一眼看见</text>
  <text x="64" y="534" fill="#5B6673" font-size="12.5">每个会话一条状态记录，</text>
  <text x="64" y="556" fill="#5B6673" font-size="12.5">始终是当前状态。</text>
  <circle cx="452" cy="500" r="5" fill="#7B3FE4"/>
  <text x="468" y="505" fill="#141821" font-size="15" font-weight="700">就地指挥</text>
  <text x="448" y="534" fill="#5B6673" font-size="12.5">输入直接进这一轮——</text>
  <text x="448" y="556" fill="#5B6673" font-size="12.5">取消、切换、接管。</text>
  <circle cx="836" cy="500" r="5" fill="#2F9E6D"/>
  <text x="852" y="505" fill="#141821" font-size="15" font-weight="700">顺手审批</text>
  <text x="832" y="534" fill="#5B6673" font-size="12.5">挂起的工具审批，</text>
  <text x="832" y="556" fill="#5B6673" font-size="12.5">在终端里直接结掉。</text>
  <text x="64" y="612" fill="#7A8794" font-size="12">OSC 7501 · 任意 supervisor · 不重启、不复制会话</text>
</svg>
